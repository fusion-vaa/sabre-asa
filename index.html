<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>SABRE | Access Required</title>
    <link rel="stylesheet" href="./style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
  </head>
  <body>
    <div class="lockscreen">
      <div id="login" class="login-box">
        <div class="site-title">SABRE</div>
        <div class="site-subtitle">Access Required</div>
        <input id="password" type="password" class="password-input" autofocus placeholder="Enter Password" required autocomplete="off">
        <p id="wrongPassword" class="error-message" style="display: none">Wrong password</p>
      </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://rawcdn.githack.com/chrisveness/crypto/7067ee62f18c76dd4a9d372a00e647205460b62b/sha1.js"></script>
    <script>
      "use strict";

      function loadPage(pwd) {
        var hash = Sha1.hash(pwd);
        var url = hash + "/index.html";

        $.ajax({
          url: url,
          dataType: "html",
          success: function (data) {
            window.location = url;
          },
          error: function (xhr, ajaxOptions, thrownError) {
            $(".login-box").addClass("shake");
            setTimeout(function () {
              $(".login-box").removeClass("shake");
            }, 600);
            $("#password").attr("placeholder", "Wrong Password");
            $("#password").val("");
          }
        });
      }

      $("#password").keypress(function (e) {
        if (e.which === 13) {
          loadPage($("#password").val());
        }
      });

      $("#password").focus();
    </script>
  </body>
</html>
